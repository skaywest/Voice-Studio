name: Build Voice Studio VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/no-network-juce
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "README.md"
      - "docs/**"
      - "Source/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Test offline RVC environment probe
        working-directory: tools/rvc_worker_probe
        run: |
          python -m unittest -v
          python probe.py --json

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target VoiceStudio_VST3

      - name: Build processor smoke tests
        run: cmake --build build --config Release --target VoiceStudioProcessorSmokeTest

      - name: Build audio queue tests
        run: cmake --build build --config Release --target VoiceStudioAudioQueueTest

      - name: Build shared-memory ABI tests
        run: cmake --build build --config Release --target VoiceStudioSharedMemoryAbiTest

      - name: Build audio block ABI tests
        run: cmake --build build --config Release --target VoiceStudioAudioBlockAbiTest

      - name: Build Windows shared-memory process test
        run: cmake --build build --config Release --target VoiceStudioSharedMemoryPocTest

      - name: Run all registered tests (including cross-process IPC)
        run: ctest --test-dir build -C Release --output-on-failure --repeat until-fail:3

      - name: Audit network imports
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "build/VoiceStudio_artefacts/Release/VST3" -Filter "*.vst3" -Recurse -File | Select-Object -First 1
          if (-not $plugin) { throw "VST3 binary not found" }
          $imports = & dumpbin /nologo /imports $plugin.FullName 2>&1
          $imports | Out-File -FilePath network-import-audit.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "dumpbin import inspection failed" }

          # This is an import-table audit, not proof against dynamically resolved APIs.
          $networkDllPattern = "(?im)^\s*(WININET|WS2_32|WINHTTP|URLMON|DNSAPI|WSOCK32|MSWSOCK|WEBIO|WLANAPI|RASAPI32|IPHLPAPI|NETAPI32|FWPUCLNT)\.dll\s*$"
          $networkApiPattern = "(?im)^\s*(InternetOpen[A|W]?|InternetConnect[A|W]?|InternetOpenUrl[A|W]?|InternetReadFile|HttpOpenRequest[A|W]?|HttpSendRequest[A|W]?|HttpSendRequestEx[A|W]?|WinHttpOpen|WinHttpConnect|WinHttpOpenRequest|WinHttpSendRequest|WinHttpReceiveResponse|WinHttpReadData|URLDownloadToFile[A|W]?|URLOpenBlockingStream[A|W]?|DnsQuery[A|W]?|DnsQueryEx|socket|WSASocket[A|W]?|WSAStartup|connect|send|recv|getaddrinfo|GetAddrInfoW|gethostbyname)\s*$"

          $importText = $imports -join "`n"
          $dllMatches = [regex]::Matches($importText, $networkDllPattern)
          $apiMatches = [regex]::Matches($importText, $networkApiPattern)
          if ($dllMatches.Count -gt 0 -or $apiMatches.Count -gt 0) {
            Write-Host "Potential network imports detected:"
            $dllMatches | ForEach-Object { Write-Host $_.Value }
            $apiMatches | ForEach-Object { Write-Host $_.Value }
            throw "Potential network-related imports remain in VST3 binary"
          }
          if ($importText -match "(?im)^\s*(LoadLibraryA|LoadLibraryW|GetProcAddress)\s*$") {
            Write-Host "NOTE: dynamic module-loading APIs are imported; static imports cannot rule out runtime resolution."
          }
          Write-Host "PASS: no imports from the expanded audited network DLL/API list were found"

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          $releaseUrl = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          Invoke-WebRequest -Uri $releaseUrl -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval -Force
          $validator = Get-ChildItem pluginval -Filter "pluginval.exe" -Recurse -File | Select-Object -First 1
          if (-not $validator) { throw "pluginval.exe was not found in the pinned release archive" }
          $plugin = Get-ChildItem "build/VoiceStudio_artefacts/Release/VST3" -Filter "*.vst3" -Recurse -File | Select-Object -First 1
          if (-not $plugin) { throw "VST3 binary not found for pluginval" }
          & $validator.FullName --strictness-level 5 --skip-gui-tests --timeout-ms 60000 $plugin.FullName
          $pluginvalExitCode = $LASTEXITCODE
          if ($null -ne $pluginvalExitCode -and $pluginvalExitCode -ne 0) { throw "pluginval validation failed with exit code $pluginvalExitCode" }

      - name: Upload VST3 and audit
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-no-network-experiment-Windows-x64
          path: |
            build/VoiceStudio_artefacts/Release/VST3/
            network-import-audit.txt
