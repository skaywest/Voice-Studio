name: Build Voice Studio VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - experiment/no-network-juce
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "README.md"
      - "Source/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target VoiceStudio_VST3

      - name: Audit network imports
        shell: pwsh
        run: |
          $plugin = Get-ChildItem "build/VoiceStudio_artefacts/Release/VST3" -Filter "*.vst3" -Recurse -File | Select-Object -First 1
          if (-not $plugin) { throw "VST3 binary not found" }
          $imports = & dumpbin /nologo /imports $plugin.FullName 2>&1
          $imports | Out-File -FilePath network-import-audit.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "dumpbin import inspection failed" }

          $networkDllPattern = "(?im)^\s*(WININET|WS2_32|WINHTTP|URLMON|DNSAPI|WSOCK32|MSWSOCK|WEBIO|WLANAPI|RASAPI32)\.dll\s*$"
          $networkApiPattern = "(?im)^\s*(InternetOpen|InternetConnect|HttpOpenRequest|HttpSendRequest|WinHttpOpen|WinHttpConnect|WinHttpSendRequest|URLDownloadToFile|DnsQuery|DnsQueryEx|socket|WSASocket|connect|getaddrinfo|GetAddrInfoW)\b"

          $dllMatches = [regex]::Matches(($imports -join "`n"), $networkDllPattern)
          $apiMatches = [regex]::Matches(($imports -join "`n"), $networkApiPattern)
          if ($dllMatches.Count -gt 0 -or $apiMatches.Count -gt 0) {
            Write-Host "Potential network imports detected:"
            $dllMatches | ForEach-Object { Write-Host $_.Value }
            $apiMatches | ForEach-Object { Write-Host $_.Value }
            throw "Potential network-related imports remain in VST3 binary"
          }
          Write-Host "PASS: no imports from the audited network DLLs or API names were found"

      - name: Upload VST3 and audit
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-no-network-experiment-Windows-x64
          path: |
            build/VoiceStudio_artefacts/Release/VST3/
            network-import-audit.txt
