name: Build Voice Studio VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "README.md"
      - "Source/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target VoiceStudio_VST3

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Studio-prototype-Windows-x64
          path: build/VoiceStudio_artefacts/Release/VST3/
